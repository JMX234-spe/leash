[package]
name = "leash"
version = "0.1.0"
edition = "2021"
authors = ["Leash Contributors"]
description = "Transparent security wrapper and rewind engine for AI coding agents"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
git2 = { version = "0.19", default-features = false, features = ["https"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
